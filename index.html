<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexora — premium fiber connectivity and precision-built devices." />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora — Fiber, Connectivity & Devices</title>

    <!-- ================================================================
         RUM SCRIPT SLOT
         Paste your Real User Monitoring snippet (e.g. Catchpoint RUM) here.
         Keep it as the first script in <head> so it can observe the full
         page load. src/lib/rumBridge.ts queues business context
         (pageGroup, tracepoints, indicators, conversions) and flushes it
         to window.RProfiler automatically once the snippet has loaded.
         ================================================================ -->
    <!-- RUM:BEGIN -->
    <!-- Loads only on the production site, so local runs and previews never send RUM data. -->
    <script>
      if (/(^|\.)techstore\.win$/.test(location.hostname)) {
        var cp = document.createElement("script");
        cp.defer = true;
        cp.src = "https://g.3gl.net/jp/16084/latest/InitialLoadScript.js";
        document.head.appendChild(cp);
      }
    </script>
    <!-- Send the RUM beacon on pagehide instead of unload/beforeunload (more reliable on mobile and bfcache). -->
    <script>
      if (window.RProfiler) {
        window.RProfiler.usePageHide();
      } else {
        window.addEventListener("GlimpseLoaded", function () {
          window.RProfiler.usePageHide();
        });
      }
    </script>
    <!-- RUM:END -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nexora needs JavaScript enabled to run the storefront.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
